name: zer0mi1es
description: A two-person connection app
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^17.5.0
  cupertino_icons: ^1.0.2
  image_picker: ^1.2.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  firebase_crashlytics: ^5.2.7
  flutter_local_notifications: ^22.3.0
  gal: ^2.3.3
  path_provider: ^2.1.6
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5
  flutter_colorpicker: ^1.1.0
  emoji_picker_flutter: ^4.5.3
  flutter_timezone: ^4.1.1
  timezone: ^0.11.0
  record: ^6.0.0
  just_audio: ^0.9.46
  home_widget: ^0.9.4
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.jpg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
